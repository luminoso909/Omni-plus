# 小主干 + 真实冻结特征的工程过拟合；非全尺寸正式 SFT。
data:
  train: cache/p4/train_features.pt
  validation: cache/p4/validation_features.pt

model:
  hidden_size: 64
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  head_dim: 16
  intermediate_size: 128
  num_talker_hidden_layers: 2
  talker_hidden_size: 64
  talker_num_attention_heads: 4
  talker_num_key_value_heads: 2
  talker_intermediate_size: 128
  talker_adapter_rank: 16
  bridge_layer: 0
  dropout: 0.0
  max_position_embeddings: 2048
  use_moe: false

training:
  device: mps
  dtype: float32
  seed: 42
  freeze: all
  batch_size: 2
  accumulation_steps: 2
  steps: 200
  learning_rate: 0.003
  weight_decay: 0.0
  grad_clip: 1.0
  stop_weight: 10.0
  eval_every: 25
