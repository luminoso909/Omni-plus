# R4-D：四任务 Tiny 联合 SFT；已有 A2A 仅是显式 echo 工程诊断。
extends: r4a_local.yaml
training:
  recipe: joint
  tasks: [t2a, i2t, a2t, a2a]
  steps: 4
  accumulation_steps: 4
  learning_rate: 0.001
  group_lrs: {lora: 0.0003, vision_proj: 0.001, audio_proj: 0.001}
  sample_weights: {t2a: 1.0, i2t: 1.0, a2t: 1.0, a2a: 1.0}
  task_weights: {t2a: 1.0, i2t: 1.0, a2t: 1.0, a2a: 1.0}
  allow_diagnostic_a2a: true
lora:
  enabled: true
