# R4-A：真实 tokenizer / Mimi 接口，Tiny 主干验证；不是正式 1.7B 训练。
extends: r3_local.yaml
schema_version: 2
model:
  initialization:
    talker: random
    talker_checkpoint: null
    components_checkpoint: null
    vision_checkpoint: null
    audio_checkpoint: null
training:
  steps: 8
  learning_rate: 0.003
  eval_interval: 2
  save_interval: 2
  patience: 0
  min_delta: 0.0
  group_lrs: {}
  sample_weights: {}
  task_weights: {}
  task_batch_sizes: {}
  length_bucket_size: 4
  gradient_checkpointing: false
  allow_diagnostic_a2a: false
  max_seconds: 0.0
lora:
  enabled: false
  rank: 4
  alpha: 8.0
  targets: [q_proj, v_proj]
  dropout: 0.0
evaluation:
  max_new_tokens: 64
  asr_dir: null
