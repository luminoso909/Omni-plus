[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Omni-plus"
version = "0.0.1"
description = "Independent omni-modal model reproduction and research (P0 bootstrap)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "datasets>=3,<5",
    "pyarrow>=21",
    "numpy>=1.26,<3",
    "einops>=0.8,<1",
    "safetensors>=0.5,<1",
    "PyYAML>=6,<7",
    "jaxtyping>=0.3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["omni", "omni.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping 的 Shape 字符串不是 Python forward reference；保留其它未定义变量检查。
"omni/models/thinker/model_lm.py" = ["F722"]
"omni/models/model_omni.py" = ["F722"]
"omni/models/encoders/model_encoders.py" = ["F722"]
"omni/models/talker/model_talker.py" = ["F722"]
