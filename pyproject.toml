[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Omni-plus"
version = "0.0.1"
description = "Independent omni-modal model reproduction and research (P0 bootstrap)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "datasets>=3,<5",
    "numpy>=1.26,<3",
    "einops>=0.8,<1",
    "safetensors>=0.5,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["omni", "omni.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
